# Weapon SID = capacity change in percent, applied by a hidden preinstalled upgrade.
# Each needs a unique upgrade ID above vanilla's highest (568 in game 2.1).
[hidden]
Gun_Krivenko_HG = { percent = 25, id = 9101 }   # Gambit 9mm: 12/17 -> 15/21

# SIDs defined only in DLC1's tables. Their patches go under cfg/DLCGameData/DLC1/.
[DLC1.magazines]
