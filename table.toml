[DLC1.hidden]
GunAK9_ST = { percent = -33, id = 9102 }        # AK-9 9x39: 30/45/30 -> 20/30/20

# Upgrade SID = capacity change in percent, appended to its EffectPrototypeSIDs at `index`
# (the first free index in vanilla).
[upgrades]
GunIntegral_Upgrade_Body_3 = { percent = -25, index = 5 }   # Vector/Riemann .45 swap: 17/40 -> 13/30 (MagEx2 .45)
